server {
    listen 80;
    server_name _;
    absolute_redirect off;
    charset utf-8;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    location = /learn { return 308 /learn/$is_args$args; }

    # Next static export is copied under html/learn, including _next/static.
    # Only content-hashed bundles receive an immutable cache policy.
    location ^~ /learn/_next/static/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /learn/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
        error_page 404 /learn/404.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /help { return 302 /help.html; }
    location = /help.html {
        root /usr/share/nginx/html;
    }
    location = /guide.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    # Resolve the API container again after a Compose update changes its IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend http://api:8000;
    location / {
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Research jobs can take several minutes. Never retry a submitted POST.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_next_upstream off;
        proxy_buffering off;
    }
}
